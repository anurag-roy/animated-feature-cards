<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Animated Feature Cards · Examples</title>
    <link rel="stylesheet" href="examples.css" />
    <script src="examples.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Animated Feature Cards</p>

        <button id="playback" type="button">Pause animations</button>

      </div>
    </header>
    <main class="gallery" aria-label="Animated feature card examples"></main>
